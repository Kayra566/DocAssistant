# Staging: production'a yakın yapılandırma, ayrı imaj etiketi ve sıkı ayarlar.
#
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
#
# Sırlar bu dosyada tutulmaz; ../backend/.env.staging dosyasından okunur.
name: docassistant-staging

services:
  backend:
    env_file:
      - ../backend/.env.staging
    environment:
      ENVIRONMENT: staging
      DEBUG: "false"
      EXPOSE_DEV_TOKENS: "false"
      RATE_LIMIT_BACKEND: redis
      AI_CACHE_BACKEND: redis
      PROCESS_DOCUMENTS_EAGER: "false"
      AI_JOBS_EAGER: "false"
      EXPORTS_EAGER: "false"
    # Staging'de kaynak mount edilmez; imajdaki kod çalışır.
    volumes: []
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    restart: unless-stopped

  worker:
    env_file:
      - ../backend/.env.staging
    environment:
      ENVIRONMENT: staging
      DEBUG: "false"
    volumes: []
    restart: unless-stopped

  frontend:
    restart: unless-stopped

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  minio:
    restart: unless-stopped
